# Mutation testing (CONTRIBUTING.md): the logic modules, checked by the unit tests.
[mutmut]
source_paths =
    src/classify.py
    src/optimize.py
    src/history.py
    src/ingest.py
    src/diagnostics.py
pytest_add_cli_args_test_selection = tests/
# mutmut copies only the mutated files: the dashboard tests read src/app.py, the sample tests data/.
also_copy =
    src/
    data/
    pytest.ini
# The integration checks need a real MongoDB.
pytest_add_cli_args = --ignore=tests/integration
